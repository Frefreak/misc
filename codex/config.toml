# ~/.codex/config.toml
model = "gpt-6-astra"
model_reasoning_effort = "medium"
approvals_reviewer = "auto_review"

[shell_environment_policy.set]
CLOUDSDK_CONFIG = "/Users/even/agent-env/gcloud"
KUBECONFIG = "/Users/even/agent-env/kube/config"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/even/.codex"

[notice]
fast_default_opt_out = true

[tui]
terminal_resize_reflow_max_rows = 0
session_picker_view = "dense"
status_line = ["model-with-reasoning", "current-dir", "permissions", "context-window-size", "context-used", "thread-title"]
status_line_use_colors = true
screen_reader_detection_done = true
theme = "dracula"
fullscreen_transcript = false
alternate_screen = "auto"


[features]
memories = true
js_repl = false
browser_use = true
browser_use_external = true
in_app_browser = true
[features.context_management]
experimental_mode = true

[shell_environment_policy]
inherit = "all"
